services:
  - type: web
    name: animal-tracker-backend
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: animal-tracker-db
          property: connectionString

databases:
  - name: animal-tracker-db
    plan: free
    databaseName: animal_tracker
    user: tracker
